name: watch sources
on:
  schedule: [{ cron: "17 5 * * 1" }]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: run
        run: python3 tools/watch.py > report.md || echo "changed=1" >> "$GITHUB_OUTPUT"
      - if: steps.run.outputs.changed == '1'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          title="Source changes $(date -u +%Y-%m-%d)"
          gh issue list --label source-change --state open --json title -q '.[].title' | grep -qx "$title" ||
            gh issue create --title "$title" --label source-change --body-file report.md
